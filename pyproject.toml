[project]
name = "any-object-viewer"
version = "0.1.0"
description = "任意物体認証の検証ツール"
readme = "README.md"
authors = [
    { name = "TS0321", email = "TS0321@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imgui-bundle>=1.92.801",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[project.scripts]
aov = "any_object_viewer.gui.app:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
